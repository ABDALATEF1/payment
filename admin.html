<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Orders</title>

<style>
body{
    font-family: Arial;
    padding:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#007bff;
    color:white;
}
</style>

</head>
<body>

<h2>Orders Dashboard</h2>

<table>
<thead>
<tr>
<th>ID</th>
<th>Order ID</th>
<th>Amount</th>
<th>Status</th>
<th>Payment Type</th>
<th>Transaction Status</th>
<th>Date</th>
</tr>
</thead>

<tbody id="ordersTable">
</tbody>

</table>

<script>
async function loadOrders() {

    const response =
    await fetch('http://api.shop.localhost/api/all-orders');

    const data = await response.json();

    const table =
    document.getElementById('ordersTable');

    table.innerHTML = '';

    data.forEach(order => {

        table.innerHTML += `
        <tr>
            <td>${order.id}</td>
            <td>${order.order_id}</td>
            <td>${order.amount}</td>
            <td>${order.status}</td>
            <td>${order.payment_type || '-'}</td>
            <td>${order.transaction_status || '-'}</td>
            <td>${order.created_at}</td>
        </tr>
        `;
    });
}

loadOrders();
</script>

</body>
</html>
